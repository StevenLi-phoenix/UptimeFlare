name: Upstream PR

# Weekly: merge lyc8503/UptimeFlare main into a branch and open a PR, so upstream fixes arrive
# for review. The upstream "Upstream Sync" workflow (sync.yaml) resets the repo to upstream and
# would drop this fork's changes (core report controller, alert mails, uptime.config.ts); don't
# run it. Deploy stays manual: gh workflow run deploy.yml.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  upstream-pr:
    if: github.repository == 'StevenLi-phoenix/UptimeFlare'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream into a branch and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # this repo is a fork: without --repo, gh targets the parent lyc8503/UptimeFlare
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/lyc8503/UptimeFlare.git
          git fetch -q upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "upstream commits not in main: $behind"
          if [ "$behind" -eq 0 ]; then exit 0; fi
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName -q '.[].headRefName' | grep '^upstream/' || true)
          if [ -n "$open" ]; then echo "an upstream PR is already open ($open); review it first"; exit 0; fi
          head=$(git rev-parse --short upstream/main)
          branch="upstream/$head"
          git switch -c "$branch"
          if git merge --no-edit upstream/main; then
            note="Merges cleanly."
          else
            git merge --abort
            git reset -q --hard upstream/main
            note="**Conflicts with main.** This branch is upstream as-is; merge it locally and resolve."
          fi
          # upstream/<sha> branches belong to this workflow: a rerun deletes its own earlier attempt first
          git push -q origin --delete "$branch" 2>/dev/null || true
          if ! git push -q origin "$branch"; then
            # the workflow token cannot push commits that touch .github/workflows
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Upstream $head needs a manual merge" \
              --body "Pushing $branch failed, probably because upstream changed .github/workflows. Merge lyc8503/UptimeFlare main by hand." \
              || echo "::warning::push failed and issues are disabled; merge upstream $head by hand"
            exit 0
          fi
          # PR body: what exactly comes in, and where it touches files this fork also changed
          base=$(git merge-base origin/main upstream/main)
          up_files=$(git diff --name-only "$base" upstream/main)
          fork_files=$(git diff --name-only "$base" origin/main)
          overlap=$(comm -12 <(echo "$up_files" | sort) <(echo "$fork_files" | sort) | grep . || true)
          {
            echo "Merges $behind commit(s) from [lyc8503/UptimeFlare](https://github.com/lyc8503/UptimeFlare) \`main\` (up to \`$head\`). $note"
            echo
            echo "## Commits"
            echo
            git log --reverse --format='- [`%h`](https://github.com/lyc8503/UptimeFlare/commit/%H) %ad %an: %s' --date=short origin/main..upstream/main \
              | sed -E 's@\(#([0-9]+)\)@([#\1](https://github.com/lyc8503/UptimeFlare/pull/\1))@'
            echo
            echo "## Files"
            echo
            echo '```'
            git diff --stat "$base" upstream/main
            echo '```'
            echo
            echo "## Overlap with this fork's own changes"
            echo
            if [ -n "$overlap" ]; then echo "$overlap" | sed 's/^/- `/; s/$/` (changed here too: review closely)/'; else echo "None: upstream only touches files this fork has not changed."; fi
            echo
            echo "<details><summary>Full upstream diff</summary>"
            echo
            echo '```diff'
            git diff "$base" upstream/main | head -c 50000
            echo '```'
            echo "</details>"
            echo
            echo "Merging to \`main\` triggers \`deploy.yml\`. After the deploy, check the status page."
          } > /tmp/pr-body.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "chore: merge upstream lyc8503/UptimeFlare ($head)" \
            --body-file /tmp/pr-body.md
